<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3730a3"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="capTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf6ec"/>
      <stop offset="1" stop-color="#ece5d4"/>
    </linearGradient>
    <filter id="capShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- macOS-style rounded-square canvas with transparent margins -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <!-- subtle top sheen -->
  <path d="M 284 100 h 456 a 184 184 0 0 1 184 184 v 60 q -412 96 -824 0 v -60 a 184 184 0 0 1 184 -184 z"
        fill="#ffffff" opacity="0.06"/>

  <!-- keycap: darker lip below, lighter top face -->
  <g filter="url(#capShadow)">
    <rect x="282" y="330" width="460" height="430" rx="92" fill="#c6bda9"/>
    <rect x="282" y="288" width="460" height="430" rx="92" fill="url(#capTop)"/>
  </g>

  <!-- "T" drawn as shapes (no font dependency) -->
  <g fill="#312e81">
    <rect x="388" y="392" width="248" height="66" rx="33"/>
    <rect x="479" y="392" width="66" height="238" rx="33"/>
  </g>
</svg>
