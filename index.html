<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thock — Settings</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="app">
      <header class="app__header">
        <span class="app__logo" aria-hidden="true">⌨️</span>
        <div>
          <h1 class="app__title">Thock</h1>
          <p class="app__subtitle">Mechanical keyboard sounds</p>
        </div>
      </header>

      <section class="card">
        <label class="switch">
          <span class="switch__label">Keyboard sounds</span>
          <input type="checkbox" id="enabled" />
          <span class="switch__track"><span class="switch__thumb"></span></span>
        </label>

        <label class="switch">
          <span class="switch__label">Mouse click sounds</span>
          <input type="checkbox" id="mouse" />
          <span class="switch__track"><span class="switch__thumb"></span></span>
        </label>

        <div class="field">
          <div class="field__row">
            <label for="pack">Sound pack</label>
          </div>
          <select id="pack" class="select"></select>
          <p class="field__desc" id="pack-desc"></p>
        </div>

        <div class="field">
          <div class="field__row">
            <label for="volume">Volume</label>
            <output id="volume-out">60%</output>
          </div>
          <input type="range" id="volume" min="0" max="100" value="60" />
        </div>

        <div class="field">
          <div class="field__row">
            <label for="pitch">Pitch variation</label>
            <output id="pitch-out">25%</output>
          </div>
          <input type="range" id="pitch" min="0" max="100" value="25" />
        </div>

        <label class="switch">
          <span class="switch__label">Play sound on key release</span>
          <input type="checkbox" id="release" />
          <span class="switch__track"><span class="switch__thumb"></span></span>
        </label>

        <button id="test" class="btn">Test sound</button>
      </section>

      <p class="hint" id="hint"></p>

      <section class="card card--about">
        <div class="about__row">
          <span class="app__logo" aria-hidden="true">⌨️</span>
          <div>
            <p class="about__name">Thock</p>
            <p class="about__version" id="app-version">v0.2.0</p>
          </div>
        </div>
        <p class="about__desc">
          Cross-platform mechanical keyboard sound simulator.<br/>
          All bundled sounds are CC0 — procedurally synthesized.
        </p>
        <div class="about__links">
          <a class="about__link" href="https://github.com/ArahKarya/thock" target="_blank" rel="noopener">
            GitHub
          </a>
          <span class="about__dot" aria-hidden="true">·</span>
          <a class="about__link" href="https://github.com/ArahKarya/thock/releases" target="_blank" rel="noopener">
            Releases
          </a>
          <span class="about__dot" aria-hidden="true">·</span>
          <a class="about__link" href="https://github.com/ArahKarya/thock/blob/main/LICENSE" target="_blank" rel="noopener">
            MIT License
          </a>
        </div>
        <p class="about__copy">© 2026 Arah Karya Sinergi (AKS)</p>
      </section>
    </main>
  </body>
</html>
